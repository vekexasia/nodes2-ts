group 'com.andreabaccega'
version '1.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'application'

application {
    mainClass = 'com.andreabaccega.CreateTests'
}


repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

ext {
    s2JavaCommit = '57151fc0f7'
    s2JavaVersion = 'HEAD-SNAPSHOT'
}

dependencies {
    implementation 'org.json:json:20160212'
    implementation "com.google.geometry:s2-geometry-library:${s2JavaVersion}"
}
